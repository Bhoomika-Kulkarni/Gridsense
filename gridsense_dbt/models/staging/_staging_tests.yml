version: 2

models:
  - name: stg_regions
    description: "Staging model for grid regions."
    columns:
      - name: region_key
        tests:
          - not_null
          - unique

      - name: region_name
        tests:
          - not_null
          - unique
  - name: stg_customers
    description: "Staging model for GridSense customers."
    columns:
      - name: customer_key
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - unique

      - name: tariff_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tariffs')
                field: tariff_key
      - name: region_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_key   
  - name: stg_meters
    description: "Staging model for GridSense meters."
    columns:
      - name: meter_key
        tests:
          - not_null
          - unique

      - name: meter_id
        tests:
          - not_null
          - unique

      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key

      - name: region_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_key

      - name: installation_date
        tests:
          - not_null

      - name: status
        tests:
          - not_null
  - name: stg_assets
    description: "Staging model for GridSense grid assets."
    columns:
      - name: asset_key
        tests:
          - not_null
          - unique

      - name: asset_id
        tests:
          - not_null
          - unique

      - name: region_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_key

      - name: capacity
        tests:
          - not_null

      - name: status
        tests:
          - not_null
  - name: stg_dates
    description: "Staging model for GridSense calendar dates."
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

      - name: full_date
        tests:
          - not_null
          - unique

      - name: year
        tests:
          - not_null

      - name: month
        tests:
          - not_null

      - name: day
        tests:
          - not_null

      - name: is_weekend
        tests:
          - not_null
  - name: stg_tariffs
    description: "Staging model for GridSense tariff categories."
    columns:
      - name: tariff_key
        tests:
          - not_null
          - unique

      - name: tariff_name
        tests:
          - not_null
          - unique
  - name: stg_outages
    description: "Staging model for GridSense outage events."
    columns:
      - name: outage_key
        tests:
          - not_null
          - unique

      - name: outage_id
        tests:
          - not_null
          - unique

      - name: asset_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_assets')
                field: asset_key

      - name: region_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_key

      - name: start_time
        tests:
          - not_null

      - name: end_time
        tests:
          - not_null

      - name: duration_minutes
        tests:
          - not_null

      - name: cause
        tests:
          - not_null
  - name: stg_maintenance
    description: "Staging model for GridSense maintenance work orders."
    columns:
      - name: maintenance_key
        tests:
          - not_null
          - unique

      - name: work_order_id
        tests:
          - not_null
          - unique

      - name: asset_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_assets')
                field: asset_key

      - name: region_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_key

      - name: scheduled_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dates')
                field: date_key

      - name: scheduled_date
        tests:
          - not_null

      - name: status
        tests:
          - not_null
  - name: stg_energy_usage
    description: "Staging model for GridSense energy meter readings."
    columns:
      - name: energy_usage_key
        tests:
          - not_null

      - name: meter_key
        tests:
          - not_null

      - name: customer_key
        tests:
          - not_null

      - name: region_key
        tests:
          - not_null

      - name: date_key
        tests:
          - not_null

      - name: reading_timestamp
        tests:
          - not_null

      - name: kwh
        tests:
          - not_null
  - name: mart_grid_daily_kpis
    description: "Daily regional grid KPIs combining energy usage and outage metrics."
    columns:
      - name: date_key
        tests:
          - not_null

      - name: full_date
        tests:
          - not_null

      - name: region_key
        tests:
          - not_null

      - name: region_name
        tests:
          - not_null

      - name: total_kwh
        tests:
          - not_null

      - name: outage_count
        tests:
          - not_null

      - name: total_outage_minutes
        tests:
          - not_null
  - name: mart_regional_energy
    description: "Regional energy consumption summary for GridSense."
    columns:
      - name: region_key
        tests:
          - not_null
          - unique

      - name: region_name
        tests:
          - not_null
          - unique

      - name: total_kwh
        tests:
          - not_null

      - name: average_daily_kwh
        tests:
          - not_null

      - name: peak_daily_kwh
        tests:
          - not_null

      - name: total_readings
        tests:
          - not_null

      - name: average_active_meters
        tests:
          - not_null

      - name: average_active_customers
        tests:
          - not_null
  - name: mart_outage_analysis
    description: "Regional outage analysis by outage cause."
    columns:
      - name: region_key
        tests:
          - not_null

      - name: region_name
        tests:
          - not_null

      - name: cause
        tests:
          - not_null

      - name: outage_count
        tests:
          - not_null

      - name: total_outage_minutes
        tests:
          - not_null

      - name: average_outage_minutes
        tests:
          - not_null

      - name: maximum_outage_minutes
        tests:
          - not_null

      - name: affected_asset_count
        tests:
          - not_null
  - name: mart_asset_maintenance
    description: "Asset-level maintenance summary for GridSense."
    columns:
      - name: asset_key
        tests:
          - not_null
          - unique

      - name: asset_id
        tests:
          - not_null
          - unique

      - name: region_name
        tests:
          - not_null

      - name: capacity
        tests:
          - not_null

      - name: asset_status
        tests:
          - not_null

      - name: maintenance_count
        tests:
          - not_null

      - name: completed_maintenance_count
        tests:
          - not_null

      - name: scheduled_maintenance_count
        tests:
          - not_null

      - name: in_progress_maintenance_count
        tests:
          - not_null
  - name: stg_weather
    description: "Staging model for weather observations."
    columns:
      - name: weather_key
        tests:
          - not_null
          - unique

      - name: location
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_name

      - name: reading_timestamp
        tests:
          - not_null

      - name: temperature
        tests:
          - not_null

      - name: rainfall
        tests:
          - not_null

      - name: wind
        tests:
          - not_null
  - name: mart_weather_regional
    description: "Daily regional weather analytics mart."
    columns:
      - name: region_name
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_name

      - name: weather_date
        tests:
          - not_null

      - name: average_temperature
        tests:
          - not_null

      - name: max_temperature
        tests:
          - not_null

      - name: total_rainfall
        tests:
          - not_null

      - name: average_wind
        tests:
          - not_null

      - name: max_wind
        tests:
          - not_null